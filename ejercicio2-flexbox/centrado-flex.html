<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Div centrado con flex</title>
<style>
  :root {
    --colorFondo: #dfe6ec;
    --colorAcento: #3a6ea5;
    --colorBlanco: #ffffff;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: var(--colorFondo);
  }

  .caja {
    width: 200px;
    height: 200px;
    background-color: var(--colorAcento);
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--colorBlanco);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
  }
</style>
</head>
<body>

<div class="caja">
  Div centrado
</div>

</body>
</html>
