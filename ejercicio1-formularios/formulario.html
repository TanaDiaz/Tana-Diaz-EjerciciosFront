<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de contacto</title>
<style>
  :root {
    --colorFondo: #e9edf2;
    --colorPrimario: #1c2b39;
    --colorAcento: #3a6ea5;
    --colorAcentoOscuro: #2d567e;
    --colorBorde: #c7c7c7;
    --colorTexto: #333333;
    --colorGris: #777777;
    --colorBlanco: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: var(--colorFondo);
    display: flex;
    justify-content: center;
    padding: 40px 15px;
  }

  main {
    background-color: var(--colorBlanco);
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    padding: 30px;
    width: 100%;
    max-width: 480px;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    color: var(--colorPrimario);
    margin-bottom: 25px;
  }

  .campo {
    margin-bottom: 18px;
  }

  .campo label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: var(--colorTexto);
  }

  .campo input[type="text"],
  .campo input[type="email"],
  .campo select,
  .campo textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--colorBorde);
    border-radius: 5px;
    font-size: 14px;
    font-family: inherit;
  }

  .campo textarea {
    resize: vertical;
  }

  .campo input:focus,
  .campo select:focus,
  .campo textarea:focus {
    outline: none;
    border-color: var(--colorAcento);
  }

  .contador {
    font-size: 12px;
    color: var(--colorGris);
    text-align: right;
    margin-top: 4px;
  }

  .opciones-check label {
    display: block;
    font-weight: normal;
    margin-bottom: 8px;
    font-size: 14px;
  }

  .opciones-check input {
    width: auto;
    margin-right: 8px;
  }

  .terminos {
    font-size: 13px;
    color: var(--colorTexto);
    margin-bottom: 20px;
  }

  .terminos input {
    width: auto;
    margin-right: 8px;
  }

  button {
    width: 100%;
    padding: 11px;
    background-color: var(--colorAcento);
    color: var(--colorBlanco);
    border: none;
    border-radius: 5px;
    font-size: 15px;
    cursor: pointer;
  }

  button:hover {
    background-color: var(--colorAcentoOscuro);
  }
</style>
</head>
<body>

<main>
  <h1>Formulario de contacto</h1>
  <form>

    <div class="campo">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" maxlength="30">
    </div>

    <div class="campo">
      <label for="apellido">Apellido</label>
      <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" maxlength="30">
    </div>

    <div class="campo">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Tu email" required>
    </div>

    <div class="campo">
      <label for="asunto">Asunto</label>
      <select id="asunto" name="asunto">
        <option selected>Elegi una opcion</option>
        <option value="presupuesto">Pedir presupuesto</option>
        <option value="cita">Solicitar cita previa</option>
        <option value="otros">Otros</option>
      </select>
    </div>

    <div class="campo opciones-check">
      <label>Como nos has conocido</label>
      <label><input type="checkbox" name="conocido" value="amigo"> Un amigo</label>
      <label><input type="checkbox" name="conocido" value="google"> Googleando</label>
      <label><input type="checkbox" name="conocido" value="redes"> Redes sociales</label>
      <label><input type="checkbox" name="conocido" value="otros"> Otros</label>
    </div>

    <div class="campo">
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="5" maxlength="300" placeholder="Escribi tu mensaje"></textarea>
      <div class="contador">Maximo 300 caracteres</div>
    </div>

    <div class="terminos">
      <label><input type="checkbox" id="terminos" name="terminos" required> Acepto los terminos y condiciones</label>
    </div>

    <button type="submit">Enviar</button>

  </form>
</main>

</body>
</html>
